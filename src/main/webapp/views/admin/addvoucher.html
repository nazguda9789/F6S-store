<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="Admin Dashboard" />
  <meta name="author" content="Your Name" />
  <title>Admin Dashboard</title>
  <head th:replace="common/libadmin :: libheaderadmin"></head>
</head>
<body class="sb-nav-fixed">
<div th:replace="common/navbarAdmin :: headerAdmin"></div>
<div id="layoutSidenav">
  <div th:replace="common/navbarAdmin :: sidenavAdmin"></div>
  <div id="layoutSidenav_content">
    <main>
      <div class="container-fluid">
        <h1 class="mt-4">Quản lý khuyến mại</h1>

        <div class="card mb-4">
          <div class="card-header">
            <span th:text="${param.id == null?'Thêm khuyến mại':'Cập nhật khuyến mại'}"></span>
            <a href="list" class="btn btn-primary btn-add-vendor float-end"><i class="fas fa-list"></i> Danh sách khuyến mại</a>
          </div>
          <div class="card-body">
            <form th:object="${voucher}" method="post" class="col-sm-5">
              <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
                <span th:text="${error}">Lỗi xảy ra</span>

              </div>
              <input th:field="*{id}" type="hidden" class="form-control">
              <label class="lb-form">Mã khuyến mại</label>
              <input th:field="*{code}" type="text" class="form-control">
              <label class="lb-form">Tên khuyến mại</label>
              <input th:field="*{name}" type="text" class="form-control">
              <label class="lb-form">Giá giảm</label>
              <input th:field="*{discount}" type="text" class="form-control" id="discount">
              <label class="lb-form">Đơn tối thiểu</label>
              <input th:field="*{minAmount}" type="text" class="form-control" id="minAmount"><br>
              <label class="checkbox-custom">Dừng hoạt động
                <input th:field="*{block}" type="checkbox">
                <span class="checkmark-checkbox"></span>
              </label>
              <br><br>
              <button class="btn btn-success form-control action-btn" th:text="${param.id == null?'Thêm khuyến mại':'Cập nhật khuyến mại'}"></button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script>
  function formatNumber(value) {
    // Bỏ hết ký tự không phải số
    value = value.replace(/\D/g, "");
    // Thêm dấu . mỗi 3 số
    return value.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  }

  function unformatNumber(value) {
    // Bỏ hết dấu chấm
    return value.replace(/\./g, "");
  }

  document.addEventListener("DOMContentLoaded", function() {
    const discountInput = document.getElementById("discount");
    const minAmountInput = document.getElementById("minAmount");

    [discountInput, minAmountInput].forEach(function(input) {
      input.addEventListener("input", function(e) {
        let cursor = input.selectionStart;
        let value = unformatNumber(input.value);
        if (value) {
          input.value = formatNumber(value);
        } else {
          input.value = "";
        }
      });
    });

    // Khi submit form, bỏ format (bỏ dấu .)
    const form = discountInput.closest('form');
    form.addEventListener("submit", function(e) {
      discountInput.value = unformatNumber(discountInput.value);
      minAmountInput.value = unformatNumber(minAmountInput.value);
    });
  });
</script>

<script>

  document.addEventListener("DOMContentLoaded", function() {
    const discountInput = document.getElementById("discount");
    const minAmountInput = document.getElementById("minAmount");

    if (discountInput && discountInput.value) {
      discountInput.value = formatNumber(discountInput.value);
    }
    if (minAmountInput && minAmountInput.value) {
      minAmountInput.value = formatNumber(minAmountInput.value);
    }
  });
</script>
</body>

</html>
