<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="Admin Dashboard" />
  <meta name="author" content="F6S" />
  <title>Phiếu giảm giá · F6S</title>
  <head th:replace="common/libadmin :: libheaderadmin"></head>
</head>
<body class="sb-nav-fixed">
<div th:replace="common/navbarAdmin :: headerAdmin"></div>
<div id="layoutSidenav">
  <div th:replace="common/navbarAdmin :: sidenavAdmin"></div>
  <div id="layoutSidenav_content">
    <main>
      <div class="container-fluid">
        <h1 class="mt-4">Danh sách phiếu giảm giá</h1>

        <div class="card mb-4">
          <div class="card-header">
            <i class="fas fa-table me-1"></i>
            Danh Sách Khuyến Mại
            <a href="save" class="btn btn-primary btn-add-vendor float-end"><i class="fas fa-plus"></i> Thêm khuyến mại</a>
          </div>
          <div class="card-body">
            <div class="row mb-3 align-items-center">
            </div>
            <div class="table-responsive">
              <table id="datatablesSimple" class="table table-bordered table-striped">
                <thead>
                <tr>
                  <th>id</th>
                  <th>Mã khuyến mại</th>
                  <th>Tên khuyến mại</th>
                  <th>Giảm giá</th>
                  <th>Đơn tối thiểu</th>
                  <th>Ngày tạo</th>
                  <th>Ngày sửa</th>
                  <th>Trạng thái</th>
                  <th class="sticky-col">Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${listvoucher}">
                  <td th:text="${c.id}"></td>
                  <td th:text="${c.code}"></td>
                  <td th:text="${c.name}"></td>
                  <td th:text="${#numbers.formatDecimal(c.discount, 0, 'COMMA', 0, 'POINT')}"></td>
                  <td th:text="${#numbers.formatDecimal(c.minAmount, 0, 'COMMA', 0, 'POINT')}"></td>
                  <td th:text="${c.createdDate}"></td>
                  <td th:text="${c.updateDate}"></td>
                  <td>
                    <span class="badge bg-success text-white" th:if="${c.block == false}">Đang hoạt động</span>
                    <span class="badge bg-danger text-white" th:if="${c.block == true}">Dừng hoạt động</span>
                  </td>
                  <td>
                    <a th:href="@{delete(id=${c.id})}" class="btn btn-outline-danger btn-sm btn-action" onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này?');"><i class="fas fa-trash-alt"></i></a>
                    <a th:href="@{save(id=${c.id})}" class="btn btn-outline-primary btn-sm btn-action"><i class="fas fa-edit"></i></a>
                  </td>
                </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script>
  window.addEventListener('DOMContentLoaded', event => {
    $(document).ready(function() {
      if (!$.fn.DataTable) return; // Keep native table when CDN is unavailable.
      $('#datatablesSimple').DataTable({
        "paging": true,
        "lengthChange": true,
        "searching": true,
        "ordering": true,
        "info": true,
        "autoWidth": false,
        "responsive": true, // Enable DataTables responsive features
        "language": {
          "lengthMenu": "Showing _MENU_ entries",
          "search": "", // Keep search box label empty
          "searchPlaceholder": "Search...", // Custom placeholder
          "info": "Showing _START_ to _END_ of _TOTAL_ entries",
          "infoEmpty": "Showing 0 to 0 of 0 entries",
          "infoFiltered": "(filtered from _MAX_ total entries)",
          "paginate": {
            "first": "First",
            "last": "Last",
            "next": "Next",
            "previous": "Previous"
          }
        }
      });
      $('#showEntries').on('change', function() {
        $('#datatablesSimple').DataTable().page.len($(this).val()).draw();
      });
    });
  });
</script>
</body>
</html>
