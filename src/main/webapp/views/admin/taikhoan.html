<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Admin Dashboard" />
    <meta name="author" content="F6S" />
    <title th:text="${accountTitle + ' · F6S'}">Danh sách tài khoản · F6S</title>
    <head th:replace="common/libadmin :: libheaderadmin"></head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/lib/css/flatpickr.min.css" rel="stylesheet">
</head>
<body class="sb-nav-fixed">
<div th:replace="common/navbarAdmin :: headerAdmin"></div>
<div id="layoutSidenav">
    <div th:replace="common/navbarAdmin :: sidenavAdmin"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4" th:text="${accountTitle}">Danh sách tài khoản</h1>

                <div class="card mb-4">
                    <div class="card-header">
                        <form id="main-form" class="row container-head-time d-flex gap-2">
                            <div class="col-sm-auto d-flex align-items-center gap-2"><label for="account-active">Trạng thái</label><select id="account-active" name="active" class="form-select"><option value="">Tất cả</option><option value="true" th:selected="${active == true}" th:text="${role != null and role.name() == 'ROLE_EMPLOYEE' ? 'Đang làm' : 'Đang hoạt động'}"></option><option value="false" th:selected="${active == false}" th:text="${role != null and role.name() == 'ROLE_EMPLOYEE' ? 'Đã nghỉ' : 'Ngừng hoạt động'}"></option></select></div>
                            <div class="col-sm-auto date-input-container date-input-container-custom">
                                <input th:value="${param.from}" type="date" name="from" id="fromDate" class="form-control date-input" placeholder="Từ">
                                <i class="bi bi-calendar-date date-input-icon"></i>
                            </div>
                            <div class="col-sm-auto date-input-container date-input-container-custom">
                                <input type="date" th:value="${param.to}" name="to"  id="toDate" class="form-control date-input" placeholder="Đến">
                                <i class="bi bi-calendar-date date-input-icon"></i>
                            </div>
                            <div class="col-sm-auto d-flex align-items-center">
                                <select class="form-control" name="role">
                                    <option value="">--- Tất cả quyền ---</option>
                                    <option value="ROLE_ADMIN" th:selected="${param.role != null and param.role[0] == 'ROLE_ADMIN'}">
                                        Quyền quản trị
                                    </option>
                                    <option value="ROLE_EMPLOYEE" th:selected="${param.role != null and param.role[0] == 'ROLE_EMPLOYEE'}">Quyền nhân viên</option>
                                    <option value="ROLE_USER" th:selected="${param.role != null and param.role[0] == 'ROLE_USER'}">Quyền người dùng</option>
                                </select>
                            </div>
                            <div class="col-sm-auto d-flex align-items-center">
                                <input th:value="${param.search}" name="search" class="form-control" placeholder="Tìm theo tên, email, số điện thoại">
                            </div>
                            <div class="col-sm-auto d-flex align-items-center">
                                <button class="btn btn-primary"><i class="fa fa-search"></i></button>
                            </div>
                            <div class="col-sm-auto d-flex align-items-center">
                                <a th:href="@{list(role=${role})}" class="btn btn-outline-secondary" title="Làm mới bộ lọc"><i class="fa fa-sync"></i></a>
                            </div>
                        </form>
                        <a th:href="@{create(role=${role})}" class="btn btn-primary btn-add-vendor float-end" th:text="${'+ ' + addAccountLabel}">Thêm tài khoản</a>
                    </div>
                    <div class="card-body">
                        <div class="row row-pageable-head">
                            <div class="col-sm-auto d-flex align-items-center">
                                <label for="showEntries" class="me-2 mb-0 mobile-none">Số dòng</label>
                                <select form="main-form" name="size" class="form-select form-select-sm" id="showEntries">
                                    <option value="5" th:selected="${param.size != null and param.size[0] == '5'}">5</option>
                                    <option value="10" th:selected="${param.size != null and param.size[0] == '10'}">10</option>
                                    <option value="25" th:selected="${param.size != null and param.size[0] == '25'}">25</option>
                                    <option value="50" th:selected="${param.size != null and param.size[0] == '50'}">50</option>
                                    <option value="100" th:selected="${param.size != null and param.size[0] == '100'}">100</option>
                                    <option value="1" th:selected="${param.size != null and param.size[0] == '1'}">1</option>
                                </select>
                            </div>
                            <div class="col-sm-auto d-flex align-items-center">
                                <div class="stat-container">
                                    <div class="stat-box">
                                        Tổng: <strong th:text="${page.totalElements}">0</strong>
                                    </div>
                                    <div class="stat-box">
                                        Đang hiển thị: <strong th:text="${page.numberOfElements}">0</strong></div>
                                </div>
                            </div>
                        </div><br>
                        <div class="table-responsive">
                            <table class="table table-bordered table-striped">
                                <thead>
                                <tr>
                                    <th>STT</th>
                                    <th>ID</th>
                                    <th>Email</th>
                                    <th>Họ tên</th>
                                    <th>Số điện thoại</th>
                                    <th>Ngày tạo</th>
                                    <th>Quyền</th>
                                    <th>Loại TK</th>
                                    <th>Trạng thái</th>
                                    <th>Hành động</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="c, stat : ${listUser}">
                                    <td th:text="${page.pageable.pageNumber * page.pageable.pageSize + stat.index + 1}"></td>
                                    <td th:text="${c.id}"></td>
                                    <td th:text="${c.email}"></td>
                                    <td th:text="${c.fullName}"></td>
                                    <td th:text="${@formatUtils.formatPhone(c.phone)}"></td>
                                    <td th:text="${#temporals.format(c.createdDate, 'HH:mm dd/MM/yyyy')}"></td>
                                    <td th:text="${c.role.name() == 'ROLE_ADMIN' ? 'Quản trị viên' : c.role.name() == 'ROLE_EMPLOYEE' ? 'Nhân viên' : 'Khách hàng'}"></td>
                                    <td>
                                        <span th:text="${c.userType}"></span>
                                    </td>
                                    <td>
                                        <span th:if="${c.deleted}" class="badge bg-secondary">Đã xóa</span>
                                        <span th:if="${!c.deleted and !c.accountNonLocked}" class="badge bg-danger">
                                            Đã khóa (thử sai <span th:text="${c.failedAttempts}"></span>x)
                                        </span>
                                        <span th:if="${!c.deleted and c.accountNonLocked and c.actived}" class="badge bg-success" th:text="${c.role.name() == 'ROLE_EMPLOYEE' ? 'Đang làm' : 'Đang hoạt động'}"></span>
                                        <span th:if="${!c.deleted and c.accountNonLocked and !c.actived}" class="badge bg-warning" th:text="${c.role.name() == 'ROLE_EMPLOYEE' ? 'Đã nghỉ' : 'Ngừng hoạt động'}"></span>
                                    </td>
                                    <td>
                                        <a th:href="@{create(id=${c.id})}" class="btn btn-outline-info btn-sm" title="Xem thông tin"><i class="fas fa-eye"></i></a>
                                        <a th:href="@{'create?id=' + ${c.id}}" class="btn btn-outline-primary btn-sm" title="Chỉnh sửa">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>

                        </div>

                        <!-- Pagination -->
                        <nav aria-label="Page navigation" class="navigationpage">
                            <ul class="pagination" th:if="${page.totalPages > 0}">

                                <!-- Previous -->
                                <li class="page-item" th:classappend="${page.number == 0} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{list(
                                           page=${page.number - 1},
                                           size=${page.size},
                                           from=${from != null ? #temporals.format(from,'yyyy-MM-dd') : null},
                                           to=${to != null ? #temporals.format(to,'yyyy-MM-dd') : null},
                                           role=${role},
                                           search=${search}, active=${active}
                                        )}"
                                       aria-label="Previous">
                                        <span aria-hidden="true">&laquo;</span>
                                    </a>
                                </li>

                                <!-- Pages -->
                                <li class="page-item"
                                    th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                                    th:classappend="${i == page.number} ? 'active'">
                                    <a class="page-link"
                                       th:href="@{list(
                                       page=${i},
                                       size=${page.size},
                                       from=${from != null ? #temporals.format(from,'yyyy-MM-dd') : null},
                                       to=${to != null ? #temporals.format(to,'yyyy-MM-dd') : null},
                                       role=${role},
                                       search=${search}, active=${active}
                                    )}"
                                       th:text="${i + 1}">1</a>
                                </li>

                                <!-- Next -->
                                <li class="page-item" th:classappend="${page.number >= page.totalPages - 1} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{list(
                                           page=${page.number + 1},
                                           size=${page.size},
                                           from=${from != null ? #temporals.format(from,'yyyy-MM-dd') : null},
                                           to=${to != null ? #temporals.format(to,'yyyy-MM-dd') : null},
                                           role=${role},
                                           search=${search}, active=${active}
                                        )}"
                                       aria-label="Next">
                                        <span aria-hidden="true">&raquo;</span>
                                    </a>
                                </li>
                            </ul>
                        </nav>



                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="/lib/js/flatpickr.min.js"></script>
<script src="/lib/js/flatpickr-vn.js"></script>
<script>
    flatpickr("#fromDate", {
        dateFormat: "Y-m-d",
        locale: "vn"
    });
    if($("#toDate").val() == null || $("#toDate").val() == ""){
        flatpickr("#toDate", {
            dateFormat: "Y-m-d",
            locale: "vn",
            maxDate: "today",
            defaultDate: "today"
        });
    }
    else{
        flatpickr("#toDate", {
            dateFormat: "Y-m-d",
            locale: "vn",
            maxDate: "today",
        });
    }
</script>
</body>
</html>
