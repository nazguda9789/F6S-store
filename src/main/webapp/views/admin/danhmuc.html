<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Admin Dashboard" />
    <meta name="author" content="Your Name" />
    <title>Admin Dashboard</title>
    <head th:replace="common/libadmin :: libheaderadmin"></head>
</head>
<body class="sb-nav-fixed">
<div th:replace="common/navbarAdmin :: headerAdmin"></div>
<div id="layoutSidenav">
    <div th:replace="common/navbarAdmin :: sidenavAdmin"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid">
                <h1 class="mt-4">Quản lý Danh Mục</h1>

                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-table me-1"></i>
                        Danh Sách Danh Mục
                        <a href="save" class="btn btn-primary btn-add-vendor float-end"><i class="fas fa-plus"></i> Thêm danh mục</a>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3 align-items-center">
                        </div>
                        <div class="table-responsive">
                            <table id="datatablesSimple" class="table table-bordered table-striped">
                                <thead>
                                <tr>
                                    <th>STT</th>
                                    <th>Tên danh mục</th>
                                    <th>Slug</th>
                                    <th>Danh mục cha</th>
                                    <th>Vị trí</th>
                                    <th class="sticky-col">Hành động</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="c, stat : ${listcategory}">
                                    <td th:text="${stat.index + 1}"></td>
                                    <td th:text="${c.name}" th:class="${c.isParent == true?'activecategory':''}"></td>
                                    <td th:text="${c.slug}"></td>
                                    <td th:text="${c.category == null?'':c.category.name}"></td>
                                    <td th:text="${c.position}"></td>
                                    <td>
                                        <a th:href="@{delete(id=${c.id})}" class="btn btn-outline-danger btn-sm btn-action" onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này?');"><i class="fas fa-trash-alt"></i></a>
                                        <a th:href="@{save(id=${c.id})}" class="btn btn-outline-primary btn-sm btn-action"><i class="fas fa-edit"></i></a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script>
    window.addEventListener('DOMContentLoaded', event => {
        $(document).ready(function() {
            $('#datatablesSimple').DataTable({
                "paging": true,
                "lengthChange": true,
                "searching": true,
                "ordering": true,
                "info": true,
                "autoWidth": false,
                "responsive": true, // Enable DataTables responsive features
                "language": {
                    "lengthMenu": "Showing _MENU_ entries",
                    "search": "", // Keep search box label empty
                    "searchPlaceholder": "Search...", // Custom placeholder
                    "info": "Showing _START_ to _END_ of _TOTAL_ entries",
                    "infoEmpty": "Showing 0 to 0 of 0 entries",
                    "infoFiltered": "(filtered from _MAX_ total entries)",
                    "paginate": {
                        "first": "First",
                        "last": "Last",
                        "next": "Next",
                        "previous": "Previous"
                    }
                }
            });
            $('#showEntries').on('change', function() {
                $('#datatablesSimple').DataTable().page.len($(this).val()).draw();
            });
        });
    });
</script>
</body>
</html>
