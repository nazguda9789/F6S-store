<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Admin Dashboard" />
    <meta name="author" content="Your Name" />
    <title>Banner</title>
    <head th:replace="common/libadmin :: libheaderadmin"></head>
</head>
<body class="sb-nav-fixed">
<div th:replace="common/navbarAdmin :: headerAdmin"></div>
<div id="layoutSidenav">
    <div th:replace="common/navbarAdmin :: sidenavAdmin"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid">
                <h1 class="mt-4">Quản lý Banner</h1>

                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-table me-1"></i>
                        Danh Sách Banner
                        <a href="save" class="btn btn-primary btn-add-vendor float-end"><i class="fas fa-plus"></i> Thêm banner</a>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3 align-items-center">
                        </div>
                        <div class="table-responsive">
                            <table id="datatablesSimple" class="table table-bordered table-striped">
                                <thead>
                                <tr>
                                    <th>Id</th>
                                    <th>Ảnh</th>
                                    <th>Tiêu đề</th>
                                    <th>Trang áp dụng</th>
                                    <th>Vị trí</th>
                                    <th>Ngày tạo</th>
                                    <th>Ngày sửa</th>
                                    <th>Trạng thái</th>
                                    <th class="sticky-col">Hành động</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="c : ${banners}">
                                    <td th:text="${c.id}"></td>
                                    <td><img class="img-table" th:src="${c.imageUrl}"></td>
                                    <td th:text="${c.title}"></td>
                                    <td th:text="${c.pageName}"></td>
                                    <td th:text="${c.displayOrder}"></td>
                                    <td th:text="${#temporals.format(c.createdDate, 'HH:mm dd/MM/yy')}"></td>
                                    <td th:text="${#temporals.format(c.updateDate, 'HH:mm dd/MM/yy')}"></td>
                                    <td>
                                        <span th:if="${c.active == true}" class="badge bg-success text-white">Đang hiển thị</span>
                                        <span th:if="${c.active == false}" class="badge bg-secondary text-white">Đã tắt</span>
                                    </td>
                                    <td>
                                        <a th:href="@{delete(id=${c.id})}" class="btn btn-outline-danger btn-sm btn-action" onclick="return confirm('Bạn có chắc chắn muốn xóa banner này?');"><i class="fas fa-trash-alt"></i></a>
                                        <a th:href="@{save(id=${c.id})}" class="btn btn-outline-primary btn-sm btn-action"><i class="fas fa-edit"></i></a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', event => {
        $(document).ready(function() {
            $('#datatablesSimple').DataTable({
                "paging": true,
                "lengthChange": true,
                "searching": true,
                "ordering": true,
                "info": true,
                "autoWidth": false,
                "responsive": true, // Enable DataTables responsive features
                "language": {
                    "lengthMenu": "Showing _MENU_ entries",
                    "search": "", // Keep search box label empty
                    "searchPlaceholder": "Search...", // Custom placeholder
                    "info": "Showing _START_ to _END_ of _TOTAL_ entries",
                    "infoEmpty": "Showing 0 to 0 of 0 entries",
                    "infoFiltered": "(filtered from _MAX_ total entries)",
                    "paginate": {
                        "first": "First",
                        "last": "Last",
                        "next": "Next",
                        "previous": "Previous"
                    }
                }
            });
            $('#showEntries').on('change', function() {
                $('#datatablesSimple').DataTable().page.len($(this).val()).draw();
            });
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
<script>
    var colorPicker = new iro.ColorPicker("#picker", {
        width: 200,
        color: "#f00"
    });

    var hexInput = document.getElementById("hexInput");

    colorPicker.on("color:change", function(color) {
        document.getElementById("mamau").value = color.hexString;
    });

    function truyenGT(id, cloudName, apiKey, apiSecret, isPrimary, gmail){
        document.getElementById("id").value = id
        document.getElementById("cloudName").value = cloudName
        document.getElementById("apiKey").value = apiKey
        document.getElementById("apiSecret").value = apiSecret
        document.getElementById("gmail").value = gmail
        document.getElementById("isPrimary").checked = isPrimary
    }
</script>
<script th:inline="javascript">
    var error = /*[[${error}]]*/ 'default';
    if(error != null){
        swal({
                title: "Thông báo",
                text: error,
                type: "error"
            },
            function() {
            });
    }
</script>
</body>
</html>
