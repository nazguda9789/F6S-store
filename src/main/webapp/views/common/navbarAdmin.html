    <script>
        window.addEventListener('DOMContentLoaded', event => {
            // Toggle the side navigation
            const sidebarToggle = document.body.querySelector('#sidebarToggle');
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', event => {
                    event.preventDefault();
                    document.body.classList.toggle('sb-sidenav-toggled');
                    // localStorage.setItem('sb|sidebar-toggle', document.body.classList.contains('sb-sidenav-toggled'));
                });
            }
        });
        function formatmoney(money) {
            const VND = new Intl.NumberFormat('vi-VN', {
                style: 'currency',
                currency: 'VND',
            });
            return VND.format(money);
        }

    </script>
    <script>
        window.addEventListener('load', () => {
            let total = 0;
            performance.getEntriesByType("resource").forEach(r => {
                total += r.transferSize; // bytes tải về
            });

            function formatBytes(bytes) {
                if (bytes < 1024) return bytes + " B";
                else if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + " KB";
                else return (bytes / (1024*1024)).toFixed(2) + " MB";
            }

            console.log("Total bandwidth used:", formatBytes(total));
        });
    </script>

                },

                });

    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('a.nav-link[data-urls]');
            const child = document.querySelectorAll('a.navchild[href]');

            navLinks.forEach(link => {
                const urls = JSON.parse(link.getAttribute('data-urls') || '[]');
                if (urls.includes(currentPath)) {
                    // Xóa class active khỏi các link khác
                    navLinks.forEach(l => l.classList.remove('active'));
                    // Thêm active vào link trùng URL
                    link.classList.add('active');

                    // Mở menu collapse nếu có
                    const target = link.getAttribute('data-bs-target');
                    if (target) {
                        const collapseEl = document.querySelector(target);
                        if (collapseEl) {
                            collapseEl.classList.add('show');
                        }
                    }
                }
            });
            child.forEach(link => {
                const urls = link.getAttribute('href')
                if (urls == currentPath) {
                    child.forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                }
            });
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const searchInput = document.getElementById("timkienket")
            const searchResults = document.getElementById("searchResults");

            // ✅ Lấy tất cả link từ menu sidebar
            const menuLinks = document.querySelectorAll('#layoutSidenav_nav a[href]');
            const searchLinks = [];

            menuLinks.forEach(link => {
                const href = link.getAttribute('href');
                const text = link.textContent.trim();
                if (href && text) {
                    searchLinks.push({ name: text, url: href });
                }
            });

            // ✅ Xử lý tìm kiếm khi gõ phím
            searchInput.addEventListener("keyup", function () {
                const keyword = this.value.toLowerCase().trim();
                searchResults.innerHTML = "";

                if (keyword === "") {
                    searchResults.style.display = "none";
                    return;
                }

                const matchedLinks = searchLinks.filter(item =>
                    item.name.toLowerCase().includes(keyword)
                );

                if (matchedLinks.length > 0) {
                    matchedLinks.forEach(item => {
                        const li = document.createElement("li");
                        li.className = "list-group-item list-group-item-action";
                        li.style.cursor = "pointer";
                        li.textContent = item.name;
                        li.onclick = () => window.location.href = item.url;
                        searchResults.appendChild(li);
                    });
                    searchResults.style.display = "block";
                } else {
                    searchResults.style.display = "none";
                }
            });

            // ✅ Click ngoài sẽ ẩn kết quả
            document.addEventListener("click", function (e) {
                if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                    searchResults.style.display = "none";
                }
            });
        });
    </script>




    <script>
        (() => {
        let stompClient = null;
        let stopped = false;
        let retryTimer;
        let notificationSocket;
        window.addEventListener('pagehide', () => {
            stopped = true;
            clearTimeout(retryTimer);
            if (notificationSocket) notificationSocket.close();
        }, { once: true });

        function connect() {
            if (stopped) return;
            const socket = new SockJS('/ws');
            notificationSocket = socket;
            stompClient = Stomp.over(socket);

            stompClient.connect({}, function (frame) {
                if (socket.readyState !== SockJS.OPEN) return;
                console.log('Connected: ' + frame);
                // Subscribe to a topic
                stompClient.subscribe('/topic/notifications', function (notification) {
                    alert(notification.body)
                });
                stompClient.subscribe('/topic/order', function (notification) {
                    $('.new-order-count').text(notification.body)
                    var audio = new Audio('/admin/mp3/notify-order.mp3');
                    audio.play().catch(function(err){
                        console.log("Trình duyệt chặn autoplay, cần click 1 lần để bật âm thanh:", err);
                    });
                    swal({
                        title: "Thông báo",
                        text: "Có 1 đơn hàng mới",
                        type: "info",
                        showCancelButton: true,
                        confirmButtonText: "OK",
                        cancelButtonText: "Chuyển đến"
                    }, function(isConfirm) {
                        if (!isConfirm) {
                            // Nếu click "Chuyển đến"
                            window.location.href = "/adm-prj/qtht-001/invoice/list"; // link tới trang đơn hàng
                        }
                    });
                    // hiêển thị thông báo popup ở đây
                });
                stompClient.subscribe('/topic/contact', function (notification) {
                    $('.counter-contact').text(notification.body)
                    var audio = new Audio('/admin/mp3/lienhe.mp3');
                    audio.play().catch(function(err){
                        console.log("Trình duyệt chặn autoplay, cần click 1 lần để bật âm thanh:", err);
                    });
                    swal({
                        title: "Thông báo",
                        text: "Có 1 liên hệ mới",
                        type: "info",
                        showCancelButton: true,
                        confirmButtonText: "OK",
                        cancelButtonText: "Chuyển đến"
                    }, function(isConfirm) {
                        if (!isConfirm) {
                            // Nếu click "Chuyển đến"
                            window.location.href = "/adm-prj/qtht-001/contact/list"; // link tới trang đơn hàng
                        }
                    });
                });
                stompClient.subscribe('/topic/online', function (notification) {
                    document.getElementById("dangtruycap").innerText = notification.body

                });
            }, function (error) {
                console.error('Connection failed:', error);
                if (!stopped) retryTimer = setTimeout(connect, 5000);
            });
        }

        connect();
        })();
    </script>
