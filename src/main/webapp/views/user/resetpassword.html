<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:include="common/user/libuser :: libheader"></th:block>
</head>
<body>
<div th:replace="common/user/headerUser :: headerUser"></div>
<div class="section-bottom-menu"></div>

<div class="login-section">
  <div class="block-img-login">
    <img src="image/logo.jpg" alt="" class="img-logo-login">
  </div>
  <form action="/dat-lai-mat-khau" method="post" class="content-modal-login">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
      <span th:text="${error}">Lỗi xảy ra</span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="divider"><span>Đặt Lại Mật Khẩu</span></div>
    <input name="email" th:value="${param.email}" type="hidden">
    <input name="key" th:value="${param.key}" type="hidden">
    <input name="password" type="password" class="form-control input-login" placeholder="Nhập mật khẩu mới" autocomplete="off">
    <input name="repassword" type="password" class="form-control input-login" placeholder="Xác nhận mật khẩu mới" autocomplete="off">
    <button class="w-100 btn btn-primary btn-login-main form-control">Xác Nhận</button>
    <div class="center-block">
      <a class="text-center" href="login">← Quay lại đăng nhập</a>
    </div>
  </form>
</div>
<div id="footer"></div>
</body>
<script th:inline="javascript">
  var success = /*[[${success}]]*/ 'default';
  if(success != null){
    swal({
      title: "Thông báo",
      text: success,
      type: "success"
    },
    function() {
      window.location.href = '/login'
    });
  }
</script>
</html>
