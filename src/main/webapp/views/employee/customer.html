<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="Admin Dashboard" />
  <meta name="author" content="Your Name" />
  <title>Khách hàng</title>
  <head th:replace="common/libadmin :: libheaderadmin"></head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="/lib/css/flatpickr.min.css" rel="stylesheet">
</head>
<body class="sb-nav-fixed">
<div th:replace="common/employee/navbarEmployee :: headerAdmin"></div>
<div id="layoutSidenav">
  <div th:replace="common/employee/navbarEmployee :: sidenavAdmin"></div>
  <div id="layoutSidenav_content">
    <main>
      <div class="container-fluid px-4">
        <h1 class="mt-4">Quản lý khách hàng</h1>

        <div class="card mb-4">
          <div class="card-header">
            <form id="main-form" class="row container-head-time d-flex gap-2">
              <div class="col-sm-auto date-input-container date-input-container-custom">
                <input th:value="${param.from}" type="date" name="from" id="fromDate" class="form-control date-input" placeholder="Từ">
                <i class="bi bi-calendar-date date-input-icon"></i>
              </div>
              <div class="col-sm-auto date-input-container date-input-container-custom">
                <input type="date" th:value="${param.to}" name="to"  id="toDate" class="form-control date-input" placeholder="Đến">
                <i class="bi bi-calendar-date date-input-icon"></i>
              </div>
              <div class="col-sm-auto d-flex align-items-center">
                <input th:value="${param.search}" name="search" class="form-control" placeholder="Tìm kiếm">
              </div>
              <div class="col-sm-auto d-flex align-items-center">
                <button class="btn btn-primary"><i class="fa fa-search"></i></button>
              </div>
              <div class="col-sm-auto d-flex align-items-center">
                <a th:href="list" class="btn btn-primary"><i class="fa fa-sync"></i></a>
              </div>
            </form>
          </div>
          <div class="card-body">
            <div class="row row-pageable-head">
              <div class="col-sm-auto d-flex align-items-center">
                <label for="showEntries" class="me-2 mb-0 mobile-none">Showing</label>
                <select form="main-form" name="size" class="form-select form-select-sm" id="showEntries">
                  <option value="5" th:selected="${param.size != null and param.size[0] == '5'}">5</option>
                  <option value="10" th:selected="${param.size == null || param.size[0] == '10'}">10</option>
                  <option value="25" th:selected="${param.size != null and param.size[0] == '25'}">25</option>
                  <option value="50" th:selected="${param.size != null and param.size[0] == '50'}">50</option>
                  <option value="100" th:selected="${param.size != null and param.size[0] == '100'}">100</option>
                  <option value="1" th:selected="${param.size != null and param.size[0] == '1'}">1</option>
                </select>
              </div>
              <div class="col-sm-auto d-flex align-items-center">
                <div class="stat-container">
                  <div class="stat-box">
                    Tổng: <strong th:text="${page.totalElements}">0</strong>
                  </div>
                  <div class="stat-box">
                    Đang hiển thị: <strong th:text="${page.numberOfElements}">0</strong></div>
                </div>
              </div>
            </div><br>
            <div class="table-responsive">
              <table class="table table-bordered table-striped">
                <thead>
                <tr>
                  <th>#</th>
                  <th>Họ tên</th>
                  <th>Số điện thoại</th>
                  <th>Email</th>
                  <th>Tổng đơn</th>
                  <th>Tổng tiền</th>
                  <th>Đơn gần nhất</th>
                  <th>Ngày gần nhất</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c, iter : ${listCustomer}">
                  <td th:text="${page.pageable.pageNumber * page.pageable.pageSize + iter.index + 1}"></td>
                  <td th:text="${c.fullName}"></td>
                  <td><a th:href="'tel:'+${c.phone}" th:text="${@formatUtils.formatPhone(c.phone)}"></a></td>
                  <td><a th:href="'mailto:'+${c.email}" th:text="${c.email}" target="_blank"></a></td>
                  <td th:text="${c.totalInvoice}"></td>
                  <td th:text="${#numbers.formatDecimal(c.totalAmount, 0, 'COMMA', 0, 'POINT')}"></td>
                  <td><a th:text="${c.lastInvoiceCode}" th:href="'/adm-prj/qtht-001/invoice/detail?id='+${c.lastInvoiceId}" target="_blank"></a></td>
                  <td th:text="${#temporals.format(c.lastInvoiceDate, 'HH:mm dd/MM/yyyy')}"></td>
                </tr>
                </tbody>
              </table>


            </div>

            <!-- Pagination -->
            <nav aria-label="Page navigation" class="navigationpage">
              <ul class="pagination">

                <!-- Previous -->
                <li class="page-item" th:classappend="${page.number == 0} ? 'disabled'">
                  <a class="page-link"
                     th:href="@{list(
                                           page=${page.number - 1},
                                           size=${page.size},
                                           from=${from != null ? #temporals.format(from,'yyyy-MM-dd') : null},
                                           to=${to != null ? #temporals.format(to,'yyyy-MM-dd') : null},
                                           search=${search}
                                        )}"
                     aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                  </a>
                </li>

                <!-- Pages -->
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                    th:classappend="${i == page.number} ? 'active'">
                  <a class="page-link"
                     th:href="@{list(
                                       page=${i},
                                       size=${page.size},
                                       from=${from != null ? #temporals.format(from,'yyyy-MM-dd') : null},
                                       to=${to != null ? #temporals.format(to,'yyyy-MM-dd') : null},
                                       search=${search}
                                    )}"
                     th:text="${i + 1}">1</a>
                </li>

                <!-- Next -->
                <li class="page-item" th:classappend="${page.number >= page.totalPages - 1} ? 'disabled'">
                  <a class="page-link"
                     th:href="@{list(
                                           page=${page.number + 1},
                                           size=${page.size},
                                           from=${from != null ? #temporals.format(from,'yyyy-MM-dd') : null},
                                           to=${to != null ? #temporals.format(to,'yyyy-MM-dd') : null},
                                           search=${search}
                                        )}"
                     aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                  </a>
                </li>
              </ul>
            </nav>



          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/lib/js/flatpickr.min.js"></script>
<script src="/lib/js/flatpickr-vn.js"></script>
<script>
  flatpickr("#fromDate", {
    dateFormat: "Y-m-d",
    locale: "vn"
  });
  if($("#toDate").val() == null || $("#toDate").val() == ""){
    flatpickr("#toDate", {
      dateFormat: "Y-m-d",
      locale: "vn",
      maxDate: "today",
      defaultDate: "today"
    });
  }
  else{
    flatpickr("#toDate", {
      dateFormat: "Y-m-d",
      locale: "vn",
      maxDate: "today",
    });
  }
</script>
</body>
</html>
