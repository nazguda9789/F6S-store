server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: f6s-sneaker-api
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=f6s_shop;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        use_nationalized_character_data: true
        default_batch_fetch_size: 50
        hbm2ddl:
          halt_on_error: true
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
app:
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD}
  seed-demo: ${SEED_DEMO:false}
  cors-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  media-dir: ${MEDIA_DIR:./uploads/media}
  shipping-fee: ${SHIPPING_FEE:0}
  shipping-free-above: ${SHIPPING_FREE_ABOVE:2000000}
  vnpay:
    enabled: ${VNPAY_ENABLED:false}
    merchant: ${VNPAY_TMN_CODE:}
    secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/return}
  otp:
    enabled: ${OTP_ENABLED:false}
    secret: ${OTP_SECRET:}
  smtp:
    starttls: ${SMTP_STARTTLS:true}
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:}
