server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: f6s-sneaker-api
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=f6s_shop;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        use_nationalized_character_data: true
        default_batch_fetch_size: 50
        hbm2ddl:
          halt_on_error: true
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
app:
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD}
  seed-demo: ${SEED_DEMO:false}
  cors-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
